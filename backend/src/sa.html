  c.strokeStyle = '#2c2c2c';

function door(x, y, w, h, open) {
  c.strokeStyle = '#0055aa';

  c.beginPath();
  if (open === 'right') { c.moveTo(cx, cy); c.lineTo(cx + w*s, cy); c.lineTo(cx + w*s, cy + h*s); }
  else if (open === 'down') { c.moveTo(cx, cy); c.lineTo(cx, cy + h*s); c.lineTo(cx + w*s, cy + h*s); }

  c.stroke();
  c.fillStyle = '#0055aa33';
  c.fill();
}
